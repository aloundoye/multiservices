# SQLCipher embarque OpenSSL statiquement. LNK4099 concerne uniquement les
# symboles de débogage PDB absents des objets OpenSSL vendored.
[target.x86_64-pc-windows-msvc]
rustflags = [
  "-C", "link-arg=/IGNORE:4099",
]

[target.aarch64-pc-windows-msvc]
rustflags = [
  "-C", "link-arg=/IGNORE:4099",
]
