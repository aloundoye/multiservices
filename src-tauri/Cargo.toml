[package]
name = "multiservices-senegal"
version = "0.1.0"
description = "Gestion locale de trésorerie multiservices au Sénégal"
authors = ["Kër Finance"]
edition = "2021"

[lib]
name = "multiservices_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
csv = "1.4.0"
hex = "0.4.3"
keyring = "4.1.6"
printpdf = { version = "0.12.6", default-features = false }
rand = "0.9.2"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "backup", "chrono"] }
rust_xlsxwriter = "0.99.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.4.2"
tempfile = "3.23.0"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
zeroize = { version = "1.8.2", features = ["derive"] }
